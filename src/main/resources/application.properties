# ===================================================================
# Student Management System - Application Configuration
# ===================================================================

server.port=8080

# -------------------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------------------
# Note: Ensure MySQL Server is running on port 3306.
# 'createDatabaseIfNotExist=true' automatically creates 'student_db' if it doesn't exist.
spring.datasource.url=jdbc:mysql://localhost:3306/student_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# -------------------------------------------------------------------
# Automatically creates or updates table schema based on entity definitions
spring.jpa.hibernate.ddl-auto=update

# Shows formatted SQL queries executed by Hibernate in the console log
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database dialect for MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
